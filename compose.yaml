services:
  app:
    image: ${APP_IMAGE:-ghcr.io/cwjoshlee/studylucy:main}
    restart: unless-stopped
    init: true
    env_file: .env
    user: "1000:1000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /data/sua-learning.db
      BACKUP_DIR: /data/backups
      TIME_ZONE: Asia/Seoul
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
